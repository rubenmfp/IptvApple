name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: macos-14
    steps:
      - name: Specs VLCKit
        run: |
          for p in MobileVLCKit TVVLCKit VLCKit; do
            pod spec cat $p > $p.json 2>/dev/null || pod spec cat $p --regex > $p.json 2>/dev/null || true
            v=$(grep -m1 '"version"' $p.json; grep -m1 '"http"' $p.json; grep -A4 '"platforms"' $p.json | tr -d '\n ')
            echo "::notice title=$p::$(echo $v | tr '\n' ' ')"
          done
          for p in MobileVLCKit TVVLCKit VLCKit; do
            echo "::notice title=$p versions::$(ls ~/.cocoapods/repos/trunk/Specs/*/*/*/$p 2>/dev/null | tail -8 | tr '\n' ' ')"
          done
