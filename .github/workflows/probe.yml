name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Sonde
        run: |
          mkdir -p probe-out
          bash tools/probe.sh > probe-out/result.txt 2>&1 || true
          git config user.name ci; git config user.email ci@example.com
          git add probe-out && git commit -m "résultat sonde" && git push
