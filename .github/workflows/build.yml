# Vérifie que l'appli se compile (iPhone et Apple TV), sans signature.
# Utilise Xcode 15.2 quand il est disponible : c'est la version du Mac de l'utilisateur (macOS Ventura).
name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Choisir Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          pick=""
          for v in 15.2 15.1 15.0.1 15.0 15.3 15.4; do
            if [ -d "/Applications/Xcode_$v.app" ]; then pick="/Applications/Xcode_$v.app"; break; fi
          done
          if [ -n "$pick" ]; then sudo xcode-select -s "$pick"; fi
          xcodebuild -version
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ') | $(xcodebuild -showsdks | grep -oE '(iphoneos|appletvos)[0-9.]+' | tr '\n' ' ')"

      - name: Tests du code commun
        run: |
          set -o pipefail
          xcrun swiftc -O Shared/Core/Models.swift Shared/Core/Regex.swift Shared/Core/Names.swift Shared/Core/JSONScan.swift \
            Shared/Core/Xtream.swift Tests/main.swift -o tests 2>&1 | tee tests.log
          ./tests 2>&1 | tee -a tests.log
          grep -E "error:|ÉCHEC" tests.log | head -30 | sed 's/^/::error title=Tests::/' || true
          grep -E "titres :" tests.log | sed 's/^/::notice title=Tests::/' || true
          grep -q "Tous les tests passent" tests.log

      - name: Compiler pour iPhone
        run: |
          set -o pipefail
          xcodebuild -project IptvApple.xcodeproj -target IptvApple -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios.log | grep -E "error:|warning:|BUILD" || true
          grep -E "error:" ios.log | sort -u | head -30 | sed 's/^/::error title=iPhone::/' || true
          grep -E "warning:" ios.log | grep -v "appintents" | sort -u | head -20 | sed 's/^/::warning title=iPhone::/' || true
          grep -q "BUILD SUCCEEDED" ios.log

      - name: Compiler pour Apple TV
        run: |
          set -o pipefail
          xcodebuild -project IptvApple.xcodeproj -target IptvAppleTV -configuration Release \
            -sdk appletvos CODE_SIGNING_ALLOWED=NO build 2>&1 | tee tv.log | grep -E "error:|warning:|BUILD" || true
          grep -E "error:" tv.log | sort -u | head -30 | sed 's/^/::error title=AppleTV::/' || true
          grep -E "warning:" tv.log | grep -v "appintents" | sort -u | head -20 | sed 's/^/::warning title=AppleTV::/' || true
          grep -q "BUILD SUCCEEDED" tv.log

      - name: "Fichiers d'installation (.ipa non signés, Sideloadly les signe)"
        run: |
          set -e
          v=$(grep -m1 -oE 'MARKETING_VERSION = [0-9.]+' IptvApple.xcodeproj/project.pbxproj | grep -oE '[0-9.]+$')
          mkdir -p out
          for pair in "Release-iphoneos/IptvApple.app:IptvTV-iPhone" "Release-appletvos/IptvAppleTV.app:IptvTV-AppleTV"; do
            app=build/${pair%%:*}; name=${pair##*:}
            rm -rf Payload && mkdir Payload && cp -R "$app" Payload/
            zip -qry "out/$name-$v.ipa" Payload
          done
          ls -l out
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Publier dans « Releases »
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere -y --cleanup-tag || true
          gh release create derniere out/*.ipa --prerelease --target "$GITHUB_SHA" \
            --title "Dernière version ($VERSION, $(date -u "+%d/%m %Hh%M") UTC)" \
            --notes "Fichiers à glisser dans Sideloadly : IptvTV-iPhone pour l'iPhone, IptvTV-AppleTV pour l'Apple TV."
